name: Android APK (native llama.cpp)
on:
  push:
    branches: [feat/native-chat-bench-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies and native llama artifacts
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build installable Android APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHATLAB-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
